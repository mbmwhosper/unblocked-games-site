<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeezers Games</title>
  <meta name="description" content="Sleek unblocked-style game hub." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">🎮 Skeezers Games</a>
    <input id="search" class="search" type="search" placeholder="Search games..." />
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Play Instantly</h1>
      <p>Fast game hub with categories, featured picks, and full-screen player pages.</p>
    </section>

    <section>
      <h2>Featured</h2>
      <div id="featured" class="grid"></div>
    </section>

    <section>
      <h2>Categories</h2>
      <div id="categories" class="chips"></div>
    </section>

    <section>
      <h2>All Games</h2>
      <div id="games" class="grid"></div>
    </section>
  </main>

  <footer class="footer">Skeezers.org</footer>

  <script src="/script.js"></script>
</body>
</html>
