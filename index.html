<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayPortal — Unblocked Games</title>
  <meta name="description" content="PlayPortal: fast game directory with categories, search, and per-game pages." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎮 PlayPortal</a>
    <input id="search" type="search" placeholder="Search games..." aria-label="Search games" />
  </header>

  <main class="container">
    <section class="hero">
      <h1>Unblocked Games Hub</h1>
      <p>Browse by category, open a dedicated game page, and launch in browser instantly.</p>
    </section>

    <section>
      <h2>Featured</h2>
      <div id="featuredGrid" class="grid"></div>
    </section>

    <section>
      <h2>Categories</h2>
      <div id="categories" class="chips"></div>
    </section>

    <section>
      <h2>All Games</h2>
      <div id="gameGrid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">PlayPortal • self-hosted static site</footer>

  <script src="/games-data.js"></script>
  <script src="/script.js"></script>
</body>
</html>
